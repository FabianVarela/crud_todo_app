name: crud_todo_app
description: Create a To-do List app managing CRUD in Firebase and Flutter

version: 1.0.0+1

publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  cloud_firestore: ^7.1.0
  context_menus: ^2.0.0+1
  cupertino_ui: ^1.1.6
  dart_emoji: ^0.2.0+2
  duo_kit: ^0.1.2
  equatable: ^3.0.0
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.4
  flutter_slidable: ^5.2.0
  flutter_web_plugins:
    sdk: flutter
  foldable: ^1.0.5
  freezed_annotation: ^3.1.0
  google_fonts: ^9.0.0
  hooks_riverpod: ^3.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.11.0
  uuid: ^4.6.0
  window_manager: ^0.6.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  remove_from_coverage: ^2.0.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
